<div class="filter-row">
    <div class="form-check">
        <label class="form-check-label small">
            <input data-value="{{ data_value|urlencode }}" type="checkbox" class="form-check-input filtercheck" checked>{{ text }}
        </label>
    </div>
    <div class="filter-row-end">
        <span data-value="{{ data_value|urlencode }}" class="small badge badge-pill badge-primary">-</span>
    </div>
</div>
